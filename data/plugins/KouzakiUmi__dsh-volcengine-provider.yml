url: https://github.com/KouzakiUmi/dsh-volcengine-provider
name: KouzakiUmi/dsh-volcengine-provider
category: model
description:
  en: Adds Volcengine Ark Agent Plan and Coding Plan model routes to DeepSeek Harness, with separate account and quota management, model catalog sync, and Seedream 5.5 transparent images, layer decomposition, and text recognition on Agent Plan. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.
  zh: 为 DeepSeek Harness 接入火山方舟 Agent Plan 和 Coding Plan 模型路由，分别管理账号和额度、同步模型目录，并在 Agent Plan 中使用 Seedream 5.5 生成透明图、拆分图层和识别图层文字。其 HTTP 路由未做 DSH 权限校验，浏览器中打开的任意网页都可能直接调用。
tarball: https://github.com/KouzakiUmi/dsh-volcengine-provider/releases/download/v0.2.23/dsh-volcengine-provider-0.2.23.tgz
